<script>
  const CSRF_TOKEN = "{{ csrf_token }}";

// ПІДСТАВ ДАНІ СВОЇХ ТОВАРІВ JSON (django: context['coins_json'])
const COIN_DATA = {{ coins_json|safe }};
const allCoins = COIN_DATA.map(c => ({
  id: c.id, name: c.name, image: c.image, year: c.year || '', material: c.material || '', price: c.price,
  url: '/coin/' + c.id + '/',
}));

function renderCart() {
  let cart = JSON.parse(localStorage.getItem('cart') || '{}');
  let html = '';
  let sum = 0;

  const cartKeys = Object.keys(cart);

  if (cartKeys.length === 0) {
    html = '<p class="text-center text-gray-500">Кошик порожній.</p>';
    document.getElementById('order-steps-section').style.display = 'none';
  } else {
    // ВАЖЛИВО: Виводимо в консоль, чи бачимо ми COIN_DATA
    console.log("COIN_DATA:", COIN_DATA);

    html += '<table class="w-full text-base"><tbody>';
    cartKeys.forEach(pid => {
      // Використовуємо parseInt для впевненості
      let product = COIN_DATA.find(x => parseInt(x.id) === parseInt(pid));

      if (!product) {
        console.warn("Товар з ID " + pid + " не знайдено в COIN_DATA!");
        return;
      }

      let qty = cart[pid].quantity;
      sum += product.price * qty;
      html += `<tr>
        <td class="py-2"><img src="${product.image}" class="h-14 w-14 object-cover rounded"></td>
        <td>${product.name}</td>
        <td>${qty}</td>
        <td>${product.price * qty} грн</td>
      </tr>`;
    });
    html += `</tbody></table>
      <div class="text-right font-bold text-lg mt-2">Сума: ${sum} грн</div>`;

    // ПРИМУСОВО показуємо секцію, якщо є хоч один товар
    document.getElementById('order-steps-section').style.display = 'block';
  }
  document.getElementById('cart-list').innerHTML = html;
}

function changeQty(pid, d) {
  let cart = JSON.parse(localStorage.getItem('cart') || '{}');
  if (!cart[pid]) return;
  cart[pid].quantity += d;
  if (cart[pid].quantity < 1) cart[pid].quantity = 1;
  localStorage.setItem('cart', JSON.stringify(cart));
  renderCart();
}

function removeFromCart(pid) {
  let cart = JSON.parse(localStorage.getItem('cart') || '{}');
  delete cart[pid];
  localStorage.setItem('cart', JSON.stringify(cart));
  renderCart();
}

function goToStep(n) {
  // Ховаємо всі форми
  const steps = ['step1', 'step2'];
  steps.forEach(id => {
    let el = document.getElementById(id);
    if (el) el.classList.add('hidden');
  });

  // Показуємо потрібну
  let target = document.getElementById('step' + n);
  if (target) {
    target.classList.remove('hidden');
  }
}

// --- Выбор службы доставки (НП/Укрпошта) ---
let selectedDelivery = null;
function selectDelivery(type) {
  selectedDelivery = type;
  document.getElementById('np-block').classList.toggle('delivery-active', type === 'nova');
  document.getElementById('ukr-block').classList.toggle('delivery-active', type === 'ukr');
  renderDeliveryFields(type);
}

function renderDeliveryFields(type) {
  const fields = document.getElementById('delivery-fields');
  if (type === 'nova') {
    fields.innerHTML = `
      <div>
        <label class="block text-sm font-medium mb-1">Місто (мін. 3 букви)</label>
        <div class="relative">
          <input type="text" name="city" id="np-city" class="w-full border rounded px-2 py-2 text-base" required autocomplete="off" placeholder="Почніть вводити місто">
          <ul id="city-autocomplete" class="absolute left-0 right-0 bg-white border z-20 rounded shadow hidden"></ul>
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Тип доставки</label>
        <div class="flex items-center gap-6 mt-2">
          <label class="flex items-center cursor-pointer">
            <input type="radio" name="warehouse_type" value="Branch" checked class="mr-2">
            <span>Відділення</span>
          </label>
          <label class="flex items-center cursor-pointer">
            <input type="radio" name="warehouse_type" value="Postomat" class="mr-2">
            <span>Поштомат</span>
          </label>
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Відділення/Поштомат Нової Пошти</label>
        <select name="np_office" id="np-office" class="w-full border rounded px-2 py-2 text-base" required>
          <option value="">Оберіть відділення</option>
        </select>
      </div>
    `;
    setTimeout(() => { reinitNPFields(); }, 20);
  } else if (type === 'ukr') {
    fields.innerHTML = `
      <div>
        <label class="block text-sm font-medium mb-1">Місто</label>
        <input type="text" name="ukr_city" id="ukr-city" class="w-full border rounded px-2 py-2 text-base" required autocomplete="off" placeholder="Введіть місто">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Відділення Укрпошти</label>
        <select name="ukr_office" id="ukr-office" class="w-full border rounded px-2 py-2 text-base" required>
          <option value="">Оберіть відділення</option>
        </select>
      </div>
      <div class="text-xs text-gray-500">* Підключи API Укрпошти або задай відділення вручну</div>
    `;
  } else {
    fields.innerHTML = '';
  }
}

// --- Исправленная интеграция с Новой Почтой ---
const NP_API_KEY = "1d01eb4736fe82f405ec91de2b78406b"; // твой ключ
let selectedCityRef = null;
let currentWarehouses = [];

// Инициализация автокомплита города
function reinitNPFields() {
  const cityInput = document.getElementById('np-city');
  const cityList = document.getElementById('city-autocomplete');
  if (!cityInput) return;

  cityInput.addEventListener('input', async function() {
    const input = this.value.trim();
    if (input.length < 3) { cityList.classList.add('hidden'); return; }

    try {
      const res = await fetch("https://api.novaposhta.ua/v2.0/json/", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          apiKey: NP_API_KEY,
          modelName: "Address",
          calledMethod: "searchSettlements",
          methodProperties: { CityName: input, Limit: 20 }
        })
      });
      const data = await res.json();
      const addresses = data.data?.[0]?.Addresses || [];
      cityList.innerHTML = '';

      if (!addresses.length) { cityList.classList.add('hidden'); return; }

      addresses.forEach(addr => {
        const li = document.createElement('li');
        li.textContent = addr.Present || addr.DescriptionRu || addr.Description;
        li.className = 'px-3 py-1 hover:bg-blue-100 cursor-pointer';
        li.onclick = () => {
          cityInput.value = li.textContent;
          selectedCityRef = addr.Ref;
          cityList.classList.add('hidden');
          loadNpOffices(selectedCityRef);
        };
        cityList.appendChild(li);
      });
      cityList.classList.remove('hidden');
    } catch (err) {
      console.error(err);
      cityList.classList.add('hidden');
    }
  });

  document.addEventListener('click', e => {
    if (!cityList.contains(e.target) && e.target !== cityInput) cityList.classList.add('hidden');
  });

  // Слушаем смену типа доставки
  const radios = document.querySelectorAll('input[name="warehouse_type"]');
  radios.forEach(r => r.addEventListener('change', () => renderWarehouses()));
}

// Загрузка отделений/почтоматов
async function loadNpOffices(cityRef) {
  if (!cityRef) return;
  const officeSelect = document.getElementById('np-office');
  officeSelect.innerHTML = '<option>Завантаження...</option>';

  try {
    const res = await fetch("https://api.novaposhta.ua/v2.0/json/", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        apiKey: NP_API_KEY,
        modelName: "AddressGeneral",
        calledMethod: "getWarehouses",
        methodProperties: { CityRef: cityRef }
      })
    });
    const data = await res.json();
    currentWarehouses = data.data || [];
    renderWarehouses();
  } catch (err) {
    console.error(err);
    officeSelect.innerHTML = '<option>Помилка завантаження</option>';
  }
}

// Отображение отделений в select
function renderWarehouses() {
  const officeSelect = document.getElementById('np-office');
  const selectedType = document.querySelector('#delivery-fields input[name="warehouse_type"]:checked')?.value;

  // Фильтруем по типу только если поле TypeOfWarehouse существует
  let filtered = currentWarehouses.filter(w => {
    if (!w.TypeOfWarehouse) return true;
    if (!selectedType) return true;
    return w.TypeOfWarehouse === selectedType;
  });

  officeSelect.innerHTML = '<option value="">Оберіть відділення</option>';
  if (!filtered.length) {
    officeSelect.innerHTML = '<option>Нічого не знайдено</option>';
    return;
  }

  filtered.forEach(w => {
    const opt = document.createElement('option');
    // Берём в приоритете Description, если нет — Number
    opt.value = w.Description || w.DescriptionRu || w.Number || '';
    opt.textContent = w.Description || w.DescriptionRu || w.Number || '';
    officeSelect.appendChild(opt);
  });
}

// --- Оплата ---
function showBankDetails() {
  const pay = document.getElementById('payment-select').value;
  const details = document.getElementById('bank-details');
  if (pay === 'online') {
    details.classList.remove('hidden');
    updateBankCard();
  } else {
    details.classList.add('hidden');
  }
}
function updateBankCard() {
  const bankSelect = document.getElementById('bank-select');
  const bankCard = document.getElementById('bank-card');
  if (bankSelect.value === 'monobank') {
    bankCard.textContent = '5375 4112 1234 5678';
  } else {
    bankCard.textContent = '5168 7573 9123 4567';
  }
}

// --- Відправка замовлення ---
function submitOrder() {
  console.log("WebApp initData:", window.Telegram?.WebApp?.initData);
  console.log("WebApp user:", window.Telegram?.WebApp?.initDataUnsafe?.user);
  let tg_id = null;

  // Спробуємо взяти ID з initDataUnsafe
  if (window.Telegram?.WebApp?.initDataUnsafe?.user) {
      tg_id = window.Telegram.WebApp.initDataUnsafe.user.id;
  }

  // ЯКЩО ID НЕМАЄ (а він у вас None), спробуємо дістати його з initData (це рядок)
  if (!tg_id && window.Telegram?.WebApp?.initData) {
      const initData = new URLSearchParams(window.Telegram.WebApp.initData);
      const userStr = initData.get('user');
      if (userStr) {
          const userObj = JSON.parse(userStr);
          tg_id = userObj.id;
      }
  }

  console.log("DEBUG_JS: Знайдений ID:", tg_id);

  let data = {
    lastname: document.querySelector('[name="lastname"]')?.value || '',
    firstname: document.querySelector('[name="firstname"]')?.value || '',
    phone: document.querySelector('[name="phone"]')?.value || '',
    comment: document.querySelector('[name="comment"]')?.value || '',
    telegram_id: tg_id, // Тепер тут буде справжній ID
    delivery_service: selectedDelivery,
    cart: JSON.parse(localStorage.getItem('cart') || '{}'),
  };

  fetch('/api/create_order/', {
    method: 'POST',
    headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': CSRF_TOKEN
    },
    body: JSON.stringify(data)
  })
  .then(r => r.json())
  .then(res => {
    if (res.success) {
      alert('Замовлення успішно оформлено!');
      localStorage.removeItem('cart');
      window.Telegram.WebApp.close();
    } else {
      alert('Помилка: ' + res.error);
    }
  });
}
document.addEventListener('DOMContentLoaded', function() {
  renderCart();
  goToStep(1);
  // По умолчанию выбрана Нова Пошта для старта (можно убрать если не надо)
  // selectDelivery('nova');
});

// Кошик: localStorage, лічильник, зміна кнопки
function updateCartCounter() {
  let cart = JSON.parse(localStorage.getItem('cart') || '{}');
  let sum = 0;
  Object.values(cart).forEach(obj => sum += obj.quantity);
  let c1 = document.getElementById('cart-counter');
  let c2 = document.getElementById('cart-counter-bottom');
  if (sum > 0) {
    if (c1) { c1.textContent = sum; c1.style.display = 'inline-block'; }
    if (c2) { c2.textContent = sum; c2.style.display = 'inline-block'; }
  } else {
    if (c1) c1.style.display = 'none';
    if (c2) c2.style.display = 'none';
  }
}
function markButtonInCart(productId) {
  let cart = JSON.parse(localStorage.getItem('cart') || '{}');
  let btn = document.querySelector('.add-to-cart-btn[data-product-id="'+productId+'"]');
  if (!btn) return;
  if (cart[productId]) {
    btn.textContent = 'В кошику';
    btn.classList.add('bg-green-500','hover:bg-green-600');
    btn.classList.remove('bg-blue-500','hover:bg-blue-600');
    btn.disabled = true;
  } else {
    btn.textContent = 'Додати в кошик';
    btn.classList.remove('bg-green-500','hover:bg-green-600');
    btn.classList.add('bg-blue-500','hover:bg-blue-600');
    btn.disabled = false;
  }
}
function initCartButtons() {
  document.querySelectorAll('.add-to-cart-btn').forEach(btn => {
    const productId = btn.getAttribute('data-product-id');
    markButtonInCart(productId);
    btn.onclick = function() {
      let cart = JSON.parse(localStorage.getItem('cart') || '{}');
      if (cart[productId]) return;
      cart[productId] = {quantity: 1};
      localStorage.setItem('cart', JSON.stringify(cart));
      markButtonInCart(productId);
      updateCartCounter();
    };
  });
}
document.addEventListener('DOMContentLoaded', function() {
  initCartButtons();
  updateCartCounter();
});

/* ---- Лайки (единый код для всех страниц) ---- */
function getFavorites() {
  try { return JSON.parse(localStorage.getItem('favorites') || '[]'); } catch(e){ return []; }
}
function setFavorites(ids) {
  localStorage.setItem('favorites', JSON.stringify(ids));
}
function updateFavoriteButtons() {
  let favs = getFavorites();
  document.querySelectorAll('.favorite-btn').forEach(btn => {
    let parent = btn.closest('[data-coin-id]');
    let coinId = parent ? parseInt(parent.getAttribute('data-coin-id')) : null;
    if (!coinId) return;
    if (favs.includes(coinId)) {
      btn.querySelector('svg').style.fill = '#e74c3c';
      btn.querySelector('svg').style.stroke = '#e74c3c';
    } else {
      btn.querySelector('svg').style.fill = 'none';
      btn.querySelector('svg').style.stroke = '#e74c3c';
    }
  });
  let counter = document.getElementById('fav-counter');
  if (counter) {
    if (favs.length > 0) { counter.textContent = favs.length; counter.style.display = 'block'; }
    else { counter.style.display = 'none'; }
  }
}
function toggleFavorite(coinId, btn) {
  let favs = getFavorites();
  coinId = parseInt(coinId);
  if (favs.includes(coinId)) {
    favs = favs.filter(id => id !== coinId);
  } else {
    favs.push(coinId);
  }
  setFavorites(favs);
  updateFavoriteButtons();
}
function openFavoritesModal() {
  let favs = getFavorites();
  let favList = document.getElementById('favorites-list');
  let favEmpty = document.getElementById('favorites-empty');
  favList.innerHTML = '';
  if (favs.length === 0) {
    favEmpty.style.display = '';
  } else {
    favEmpty.style.display = 'none';
    favs.forEach(fid => {
      let coin = allCoins.find(c => c.id === fid);
      if (!coin) return;
      favList.innerHTML += `
        <div class="flex gap-3 items-center bg-gray-50 rounded-lg shadow px-3 py-2">
          <img src="${coin.image}" class="w-16 h-16 rounded shadow object-cover">
          <div>
            <div class="font-bold text-blue-800">${coin.name}</div>
            <div class="text-xs text-gray-500">${coin.year}, ${coin.material}</div>
            <div class="text-blue-700 font-bold">${coin.price} грн</div>
            <a href="${coin.url}" class="text-sm text-blue-600 hover:underline mt-1 block">Перейти</a>
          </div>
          <button class="ml-auto favorite-btn" onclick="toggleFavorite(${coin.id}, this)">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="#e74c3c" viewBox="0 0 24 24" stroke="#e74c3c" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 21C12 21 4 13.713 4 8.795a4.2 4.2 0 018.193-2.025A4.2 4.2 0 0120 8.795C20 13.713 12 21 12 21z"/>
            </svg>
          </button>
        </div>
      `;
    });
  }
  document.getElementById('favorites-modal-bg').classList.remove('hidden');
}
function closeFavoritesModal() {
  document.getElementById('favorites-modal-bg').classList.add('hidden');
}
document.addEventListener('DOMContentLoaded', function(){
  updateFavoriteButtons();
  window.addEventListener('focus', updateFavoriteButtons);
});
