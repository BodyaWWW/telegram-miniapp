<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кошик</title>
  <link href="https://unpkg.com/tailwindcss@^2.2/dist/tailwind.min.css" rel="stylesheet">
  <style>
    .modal-bg { background: rgba(0,0,0,0.5); }
    .modal-content { animation: popup .25s cubic-bezier(.3,1.2,.4,1.0); }
    @keyframes popup {
      0% { transform: scale(.93) translateY(40px); opacity:0;}
      100% {transform: scale(1) translateY(0); opacity:1;}
    }
    .delivery-active {
      border-color: #22c55e !important;
      box-shadow: 0 0 0 2px #bbf7d0;
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-800">

<!-- Универсальный хедер -->
<header class="bg-white shadow fixed top-0 left-0 right-0 z-50">
  <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
    <div class="flex items-center space-x-3">
      <a href="/" class="flex items-center space-x-3">
        <img src="/media/coins/icon.png" alt="icon" width="50" height="50">
      <span class="text-lg font-semibold">Numismatic</span>
      </a>
    </div>
    <!-- Кнопка лайков -->
    <button id="fav-header-btn" class="relative flex items-center favorite-btn focus:outline-none" onclick="openFavoritesModal()" title="Вподобані">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" viewBox="0 0 24 24" fill="none" stroke="#e74c3c" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 21C12 21 4 13.713 4 8.795a4.2 4.2 0 018.193-2.025A4.2 4.2 0 0120 8.795C20 13.713 12 21 12 21z"/>
      </svg>
      <span id="fav-counter" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs font-bold px-1.5 rounded-full" style="display:none;">0</span>
    </button>
  </div>
</header>

<!-- Модалка вподобаних монет -->
<div id="favorites-modal-bg" class="modal-bg fixed inset-0 flex items-center justify-center z-50 hidden">
  <div class="modal-content bg-white rounded-2xl shadow-2xl w-[95vw] max-w-lg mx-auto p-5 relative">
    <button onclick="closeFavoritesModal()" class="absolute top-2 right-2 bg-gray-200 hover:bg-gray-400 rounded-full p-1">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-700" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
    </button>
    <h2 class="text-xl font-bold text-blue-900 mb-2">Вподобані монети</h2>
    <div id="favorites-list" class="grid grid-cols-1 gap-3"></div>
    <div id="favorites-empty" class="text-center text-gray-500 py-4 hidden">Немає вподобаних монет.</div>
  </div>
</div>

<main class="pt-20 pb-40 px-4 max-w-2xl mx-auto">
  <h1 class="text-2xl font-bold mb-4 text-center">Ваш кошик</h1>
  <div id="cart-list"></div>
  <div id="order-steps-section" class="mt-6 border-t pt-4" style="display:none;">
    <div id="steps">
      <!-- Крок 1: Дані покупця -->
      <form id="step1" class="space-y-4" autocomplete="off" onsubmit="return false;">
        <div>
          <label class="block text-sm font-medium mb-1">Прізвище</label>
          <input type="text" name="lastname" class="w-full border rounded px-2 py-2 text-base" required>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Ім'я</label>
          <input type="text" name="firstname" class="w-full border rounded px-2 py-2 text-base" required>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Телефон</label>
          <input type="text" name="phone" class="w-full border rounded px-2 py-2 text-base" required>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Коментар</label>
          <textarea name="comment" class="w-full border rounded px-2 py-2 text-base"></textarea>
        </div>
        <button type="button" class="w-full bg-blue-600 text-white px-4 py-3 rounded text-base font-semibold" onclick="goToStep(2)">Далі</button>
      </form>

      <!-- Крок 2: Вибір служби доставки -->
      <form id="step2" class="space-y-4 hidden" autocomplete="off" onsubmit="return false;">
        <div>
          <label class="block text-sm font-medium mb-1">Оберіть службу доставки</label>
          <div class="flex gap-4 mt-2">
            <!-- Блок Нова Пошта -->
            <div id="np-block" class="flex-1 cursor-pointer border-2 border-gray-300 rounded-2xl p-4 flex flex-col items-center hover:border-blue-400 transition"

<script>
// ПІДСТАВ ДАНІ СВОЇХ ТОВАРІВ JSON (django: context['coins_json'])
const COIN_DATA = {{ coins_json|safe }};
const allCoins = COIN_DATA.map(c => ({
  id: c.id, name: c.name, image: c.image, year: c.year || '', material: c.material || '', price: c.price,
  url: '/coin/' + c.id + '/',
}));

function renderCart() {
  let cart = JSON.parse(localStorage.getItem('cart') || '{}');
  let html = '';
  let sum = 0;
  if (Object.keys(cart).length === 0) {
    html = '<p class="text-center text-gray-500">Кошик порожній.</p>';
    document.getElementById('order-steps-section').style.display = 'none';
  } else {
    html += '<table class="w-full text-base"><tbody>';
    Object.keys(cart).forEach(pid => {
      let product = COIN_DATA.find(x => x.id == pid);
      if (!product) return;
      let qty = cart[pid].quantity;
      sum += product.price * qty;
      html += `<tr>
        <td class="py-2"><img src="${product.image}" class="h-14 w-14 object-cover rounded"></td>
        <td>${product.name}</td>
        <td>
          <button onclick="changeQty('${pid}',-1)" class="px-2">-</button>
          <span>${qty}</span>
          <button onclick="changeQty('${pid}',1)" class="px-2">+</button>
        </td>
        <td>${product.price * qty} грн</td>
        <td><button onclick="removeFromCart('${pid}')" class="text-red-500">✕</button></td>
      </tr>`;
    });
    html += `</tbody></table>
      <div class="text-right font-bold text-lg mt-2">Сума: ${sum} грн</div>`;
    document.getElementById('order-steps-section').style.display = 'block';
  }
  document.getElementById('cart-list').innerHTML = html;
}

function changeQty(pid, d) {
  let cart = JSON.parse(localStorage.getItem('cart') || '{}');
  if (!cart[pid]) return;
  cart[pid].quantity += d;
  if (cart[pid].quantity < 1) cart[pid].quantity = 1;
  localStorage.setItem('cart', JSON.stringify(cart));
  renderCart();
}

function removeFromCart(pid) {
  let cart = JSON.parse(localStorage.getItem('cart') || '{}');
  delete cart[pid];
  localStorage.setItem('cart', JSON.stringify(cart));
  renderCart();
}

function goToStep(n) {
  for (let i = 1; i <= 3; i++) {
    document.getElementById('step' + i).classList.add('hidden');
  }
  document.getElementById('step' + n).classList.remove('hidden');
}

// --- Выбор службы доставки (НП/Укрпошта) ---
let selectedDelivery = null;
function selectDelivery(type) {
  selectedDelivery = type;
  document.getElementById('np-block').classList.toggle('delivery-active', type === 'nova');
  document.getElementById('ukr-block').classList.toggle('delivery-active', type === 'ukr');
  renderDeliveryFields(type);
}
function renderDeliveryFields(type) {
  const fields = document.getElementById('delivery-fields');
  if (type === 'nova') {
    fields.innerHTML = `
      <div>
        <label class="block text-sm font-medium mb-1">Місто (мін. 3 букви)</label>
        <div class="relative">
          <input type="text" name="city" id="np-city" class="w-full border rounded px-2 py-2 text-base" required autocomplete="off" placeholder="Почніть вводити місто">
          <ul id="city-autocomplete" class="absolute left-0 right-0 bg-white border z-20 rounded shadow hidden"></ul>
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Тип доставки</label>
        <div class="flex items-center gap-6 mt-2">
          <label class="flex items-center cursor-pointer">
            <input type="radio" name="warehouse_type" value="Branch" checked class="mr-2" onchange="updateWarehouses()">
            <span>Відділення</span>
          </label>
          <label class="flex items-center cursor-pointer">
            <input type="radio" name="warehouse_type" value="Postomat" class="mr-2" onchange="updateWarehouses()">
            <span>Поштомат</span>
          </label>
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Відділення/Поштомат Нової Пошти</label>
        <select name="np_office" id="np-office" class="w-full border rounded px-2 py-2 text-base" required>
          <option value="">Оберіть відділення</option>
        </select>
      </div>
    `;
    setTimeout(() => { reinitNPFields(); }, 20);
  } else if (type === 'ukr') {
    fields.innerHTML = `
      <div>
        <label class="block text-sm font-medium mb-1">Місто</label>
        <input type="text" name="ukr_city" id="ukr-city" class="w-full border rounded px-2 py-2 text-base" required autocomplete="off" placeholder="Введіть місто">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Відділення Укрпошти</label>
        <select name="ukr_office" id="ukr-office" class="w-full border rounded px-2 py-2 text-base" required>
          <option value="">Оберіть відділення</option>
        </select>
      </div>
      <div class="text-xs text-gray-500">* Підключи API Укрпошти або задай відділення вручну</div>
    `;
  } else {
    fields.innerHTML = '';
  }
}
// Повторная инициализация автокомплита/скриптов после рендера блока НП
function reinitNPFields() {
  const cityInput = document.getElementById('np-city');
  const cityList = document.getElementById('city-autocomplete');
  if (!cityInput) return;
  cityInput.addEventListener('input', async function() {
    let input = this.value.trim();
    if (input.length < 3) {
      cityList.classList.add('hidden');
      return;
    }
    let res = await fetch("https://api.novaposhta.ua/v2.0/json/", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        "apiKey": NP_API_KEY,
        "modelName": "Address",
        "calledMethod": "searchSettlements",
        "methodProperties": {"CityName": input, "Limit": 8}
      })
    });
    let data = await res.json();
    let addresses = data.data && data.data[0] ? data.data[0].Addresses : [];
    cityList.innerHTML = '';
    if (addresses.length) {
      addresses.forEach(addr => {
        let li = document.createElement('li');
        li.textContent = addr.Present;
        li.className = 'px-3 py-1 hover:bg-blue-100 cursor-pointer';
        li.onclick = () => {
          cityInput.value = addr.Present;
          selectedCityRef = addr.Ref;
          cityList.classList.add('hidden');
          loadNpOffices(selectedCityRef);
        };
        cityList.appendChild(li);
      });
      cityList.classList.remove('hidden');
    } else {
      cityList.classList.add('hidden');
    }
  });
  document.addEventListener('click', function(e){
    if (!cityList.contains(e.target) && e.target !== cityInput) {
      cityList.classList.add('hidden');
    }
  });
}

// --- Інтеграція з Нова Пошта --- //
const NP_API_KEY = "1d01eb4736fe82f405ec91de2b78406b"; // <-- твій ключ!
let selectedCityRef = null;
let currentWarehouses = [];
async function loadNpOffices(cityRef) {
  let officeSelect = document.getElementById('np-office');
  officeSelect.innerHTML = '<option>Завантаження...</option>';
  let res = await fetch("https://api.novaposhta.ua/v2.0/json/", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      "apiKey": NP_API_KEY,
      "modelName": "Address",
      "calledMethod": "getWarehouses",
      "methodProperties": {"CityRef": cityRef, "Limit": 100}
    })
  });
  let data = await res.json();
  currentWarehouses = data.data || [];
  updateWarehouses();
}
function updateWarehouses() {
  let officeSelect = document.getElementById('np-office');
  if (!officeSelect) return;
  let selectedType = document.querySelector('#delivery-fields input[name="warehouse_type"]:checked').value;
  let filtered = currentWarehouses.filter(w => w.TypeOfWarehouse === selectedType);
  if (!filtered.length) {
    officeSelect.innerHTML = '<option>Нічого не знайдено</option>';
    return;
  }
  officeSelect.innerHTML = '<option value="">Оберіть відділення</option>';
  filtered.forEach(ofc => {
    officeSelect.innerHTML += `<option value="${ofc.Description}">${ofc.Description}</option>`;
  });
}

function showBankDetails() {
  const pay = document.getElementById('payment-select').value;
  const details = document.getElementById('bank-details');
  if (pay === 'online') {
    details.classList.remove('hidden');
    updateBankCard();
  } else {
    details.classList.add('hidden');
  }
}
function updateBankCard() {
  const bankSelect = document.getElementById('bank-select');
  const bankCard = document.getElementById('bank-card');
  if (bankSelect.value === 'monobank') {
    bankCard.textContent = '5375 4112 1234 5678';
  } else {
    bankCard.textContent = '5168 7573 9123 4567';
  }
}

// --- Відправка замовлення ---
function submitOrder() {
  let data = {
    lastname: document.querySelector('#step1 [name="lastname"]').value,
    firstname: document.querySelector('#step1 [name="firstname"]').value,
    phone: document.querySelector('#step1 [name="phone"]').value,
    comment: document.querySelector('#step1 [name="comment"]').value,
    delivery_service: selectedDelivery,
    city: selectedDelivery === 'nova'
      ? (document.querySelector('#delivery-fields [name="city"]')?.value || '')
      : (document.querySelector('#delivery-fields [name="ukr_city"]')?.value || ''),
    np_office: selectedDelivery === 'nova'
      ? (document.querySelector('#delivery-fields [name="np_office"]')?.value || '')
      : '',
    ukr_office: selectedDelivery === 'ukr'
      ? (document.querySelector('#delivery-fields [name="ukr_office"]')?.value || '')
      : '',
    delivery_type: selectedDelivery === 'nova'
      ? (document.querySelector('#delivery-fields input[name="warehouse_type"]:checked')?.value || '')
      : '',
    payment: document.querySelector('#step3 [name="payment"]').value,
    bank: document.querySelector('#step3 [name="bank"]') ? document.querySelector('#step3 [name="bank"]').value : null,
    cart: JSON.parse(localStorage.getItem('cart') || '{}'),
  };
  fetch('/api/create_order/', {
    method: 'POST',
    headers: {'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}'},
    body: JSON.stringify(data)
  }).then(r=>r.json()).then(res=>{
    if (res.success) {
      alert('Замовлення оформлено!');
      localStorage.removeItem('cart');
      window.location = '/catalog/';
    } else {
      alert('Помилка: ' + (res.error || 'Спробуйте ще раз.'));
    }
  });
}

// Кошик: localStorage, лічильник, зміна кнопки
function updateCartCounter() {
  let cart = JSON.parse(localStorage.getItem('cart') || '{}');
  let sum = 0;
  Object.values(cart).forEach(obj => sum += obj.quantity);
  let c1 = document.getElementById('cart-counter');
  let c2 = document.getElementById('cart-counter-bottom');
  if (sum > 0) {
    if (c1) { c1.textContent = sum; c1.style.display = 'inline-block'; }
    if (c2) { c2.textContent = sum; c2.style.display = 'inline-block'; }
  } else {
    if (c1) c1.style.display = 'none';
    if (c2) c2.style.display = 'none';
  }
}
function markButtonInCart(productId) {
  let cart = JSON.parse(localStorage.getItem('cart') || '{}');
  let btn = document.querySelector('.add-to-cart-btn[data-product-id="'+productId+'"]');
  if (!btn) return;
  if (cart[productId]) {
    btn.textContent = 'В кошику';
    btn.classList.add('bg-green-500','hover:bg-green-600');
    btn.classList.remove('bg-blue-500','hover:bg-blue-600');
    btn.disabled = true;
  } else {
    btn.textContent = 'Додати в кошик';
    btn.classList.remove('bg-green-500','hover:bg-green-600');
    btn.classList.add('bg-blue-500','hover:bg-blue-600');
    btn.disabled = false;
  }
}
function initCartButtons() {
  document.querySelectorAll('.add-to-cart-btn').forEach(btn => {
    const productId = btn.getAttribute('data-product-id');
    markButtonInCart(productId);
    btn.onclick = function() {
      let cart = JSON.parse(localStorage.getItem('cart') || '{}');
      if (cart[productId]) return;
      cart[productId] = {quantity: 1};
      localStorage.setItem('cart', JSON.stringify(cart));
      markButtonInCart(productId);
      updateCartCounter();
    };
  });
}
document.addEventListener('DOMContentLoaded', function() {
  initCartButtons();
  updateCartCounter();
});

/* ---- Лайки (единый код для всех страниц) ---- */
function getFavorites() {
  try { return JSON.parse(localStorage.getItem('favorites') || '[]'); } catch(e){ return []; }
}
function setFavorites(ids) {
  localStorage.setItem('favorites', JSON.stringify(ids));
}
function updateFavoriteButtons() {
  let favs = getFavorites();
  document.querySelectorAll('.favorite-btn').forEach(btn => {
    let parent = btn.closest('[data-coin-id]');
    let coinId = parent ? parseInt(parent.getAttribute('data-coin-id')) : null;
    if (!coinId) return;
    if (favs.includes(coinId)) {
      btn.querySelector('svg').style.fill = '#e74c3c';
      btn.querySelector('svg').style.stroke = '#e74c3c';
    } else {
      btn.querySelector('svg').style.fill = 'none';
      btn.querySelector('svg').style.stroke = '#e74c3c';
    }
  });
  let counter = document.getElementById('fav-counter');
  if (counter) {
    if (favs.length > 0) { counter.textContent = favs.length; counter.style.display = 'block'; }
    else { counter.style.display = 'none'; }
  }
}
function toggleFavorite(coinId, btn) {
  let favs = getFavorites();
  coinId = parseInt(coinId);
  if (favs.includes(coinId)) {
    favs = favs.filter(id => id !== coinId);
  } else {
    favs.push(coinId);
  }
  setFavorites(favs);
  updateFavoriteButtons();
}
function openFavoritesModal() {
  let favs = getFavorites();
  let favList = document.getElementById('favorites-list');
  let favEmpty = document.getElementById('favorites-empty');
  favList.innerHTML = '';
  if (favs.length === 0) {
    favEmpty.style.display = '';
  } else {
    favEmpty.style.display = 'none';
    favs.forEach(fid => {
      let coin = allCoins.find(c => c.id === fid);
      if (!coin) return;
      favList.innerHTML += `
        <div class="flex gap-3 items-center bg-gray-50 rounded-lg shadow px-3 py-2">
          <img src="${coin.image}" class="w-16 h-16 rounded shadow object-cover">
          <div>
            <div class="font-bold text-blue-800">${coin.name}</div>
            <div class="text-xs text-gray-500">${coin.year}, ${coin.material}</div>
            <div class="text-blue-700 font-bold">${coin.price} грн</div>
            <a href="${coin.url}" class="text-sm text-blue-600 hover:underline mt-1 block">Перейти</a>
          </div>
          <button class="ml-auto favorite-btn" onclick="toggleFavorite(${coin.id}, this)">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="#e74c3c" viewBox="0 0 24 24" stroke="#e74c3c" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 21C12 21 4 13.713 4 8.795a4.2 4.2 0 018.193-2.025A4.2 4.2 0 0120 8.795C20 13.713 12 21 12 21z"/>
            </svg>
          </button>
        </div>
      `;
    });
  }
  document.getElementById('favorites-modal-bg').classList.remove('hidden');
}
function closeFavoritesModal() {
  document.getElementById('favorites-modal-bg').classList.add('hidden');
}
document.addEventListener('DOMContentLoaded', function(){
  updateFavoriteButtons();
  window.addEventListener('focus', updateFavoriteButtons);
});
</script>
